[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chulengo"
version = "0.1.0"
description = "A small and wild llama.cpp wrapper for serving HuggingFace models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Daniel Ossipoff Jensen"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyyaml>=6.0",
    "gguf>=0.19.0",
]

[project.scripts]
chulengo = "chulengo:main"

[tool.setuptools]
py-modules = ["chulengo"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
]

# --- Formatting & linting (agentic-edit friendly baseline) ---
# black is the source of truth for style: 4-space indent, 88-col lines.
# Keep the repo black-clean; do not hand-format. See AGENTS.md.
[tool.black]
line-length = 88
target-version = ["py310"]

# ruff: lint only (formatting is black's job). Keep the default ruleset light
# so it flags real problems, not style, and never conflicts with black.
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (real bugs, not style)
    "F",   # pyflakes (undefined names, unused imports, etc.)
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line-too-long: black owns line length
]
